<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase थेट चाचणी - उपकेंद्र बाभळेश्वर</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Library -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full text-center space-y-4 border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800">उपकेंद्र बाभळेश्वर - Cloud टेस्ट</h2>
        <p class="text-xs text-slate-500">Firebase Realtime Cloud Database लाईव्ह कनेक्शन चाचणी</p>
        
        <div class="p-3 bg-slate-50 rounded-lg text-left text-xs space-y-1">
            <p><b>प्रोजेक्ट:</b> sc-babhaleshwar-portal</p>
            <p><b>डेटाबेस URL:</b> <span class="text-teal-700 font-mono text-[10px]">https://sc-babhaleshwar-portal-default-rtdb.firebaseio.com</span></p>
        </div>

        <input type="text" id="testInput" value="बाभळेश्वर टेस्ट नोंद - यशस्वी" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs text-center outline-none">

        <button onclick="sendTestRecord()" id="testBtn" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-2.5 rounded-lg text-xs shadow transition">
            Cloud वर टेस्ट मेसेज पाठवा
        </button>

        <div id="resultBox" class="p-3 rounded-lg text-xs font-bold hidden"></div>

        <div class="border-t pt-3 text-left">
            <p class="text-[11px] font-bold text-slate-600 mb-1">Cloud वरून थेट आलेला लाईव्ह डेटा:</p>
            <div id="liveDataBox" class="p-2.5 bg-slate-100 rounded text-teal-900 font-mono text-xs min-h-[40px] flex items-center justify-center">
                डेटा वाट पाहत आहे...
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDg6FD39DGe9Eksl9jzN8QYzHa3Z9mvHV4",
            authDomain: "sc-babhaleshwar-portal.firebaseapp.com",
            databaseURL: "https://sc-babhaleshwar-portal-default-rtdb.firebaseio.com",
            projectId: "sc-babhaleshwar-portal"
        };

        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            // लाईव्ह ऐकणे (Live Listener)
            db.ref('test_sync').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    document.getElementById('liveDataBox').innerText = val.text + " (वेळ: " + val.time + ")";
                    document.getElementById('liveDataBox').className = "p-2.5 bg-emerald-100 text-emerald-800 rounded font-bold text-xs";
                }
            });
        } catch (e) {
            showError("Firebase लोड करताना त्रुटी: " + e.message);
        }

        function sendTestRecord() {
            const txt = document.getElementById('testInput').value;
            const btn = document.getElementById('testBtn');
            btn.innerText = "पाठवत आहे...";
            btn.disabled = true;

            const timeNow = new Date().toLocaleTimeString();

            db.ref('test_sync').set({
                text: txt,
                time: timeNow
            }).then(() => {
                btn.innerText = "Cloud वर टेस्ट मेसेज पाठवा";
                btn.disabled = false;
                showSuccess("अभिनंदन! Firebase यशस्वीपणे कनेक्ट झाले आहे!");
            }).catch((err) => {
                btn.innerText = "Cloud वर टेस्ट मेसेज पाठवा";
                btn.disabled = false;
                showError("एरर आली: " + err.message);
            });
        }

        function showSuccess(msg) {
            const box = document.getElementById('resultBox');
            box.className = "p-3 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800";
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        function showError(msg) {
            const box = document.getElementById('resultBox');
            box.className = "p-3 rounded-lg text-xs font-bold bg-rose-100 text-rose-800";
            box.innerText = msg;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
